name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Syntax check
        run: python3 -m py_compile check-opencode-free-models.py
      - name: Test suite
        run: python3 -m unittest discover -s test -p "test_*.py"
