[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "check-opencode-free-models"
version = "1.0.0"
description = "Small tool that keeps OpenCode's free chat models in sync with opencode.jsonc: drift report + --apply with a timestamped backup."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mahirfatih" }]
keywords = ["opencode", "free-models", "chat-models", "config", "drift", "backup", "cli", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mahirfatih/check-opencode-free-models"
Repository = "https://github.com/mahirfatih/check-opencode-free-models"
Issues = "https://github.com/mahirfatih/check-opencode-free-models/issues"

[project.scripts]
check-opencode-free-models = "check_opencode_free_models:main"

[tool.hatch.build.targets.wheel]
# The repository file is ``check-opencode-free-models.py``. Python import names
# cannot contain a hyphen, so the wheel ships it as ``check_opencode_free_models.py``
# — the module name PEP 8 allows (underscores are permitted in module names when
# they improve readability) and the module the ``check-opencode-free-models``
# console script calls.
force-include = { "check-opencode-free-models.py" = "check_opencode_free_models.py" }

[tool.hatch.build.targets.sdist]
include = [
  "/check-opencode-free-models.py",
  "/pyproject.toml",
  "/README.md",
  "/README.tr.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
]
